name: ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npx tsc -p .
      - run: npm test
      - run: npm run build:web
      - name: Server starts
        shell: bash
        run: |
          PORT=8799 CONFLUX_DATA_DIR=./ci-data node apps/server/src/main.ts & echo $! > pid
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8799/api/health && break; sleep 1; done
          curl -sf http://127.0.0.1:8799/api/health
          curl -sf http://127.0.0.1:8799/ | grep -q "<div id=\"root\">"
          kill $(cat pid) || true

  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: node --test --test-concurrency=1 tests/live.test.ts
        env:
          CONFLUX_LIVE: "1"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

  desktop-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npm install -g agent-cu
      - run: node bin/conflux.ts doctor
      - run: node --test --test-concurrency=1 tests/desktop.test.ts
        env:
          CONFLUX_DESKTOP_E2E: "1"

  install-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fresh install with install.ps1 (into an empty folder, from GitHub)
        shell: pwsh
        run: |
          $d = Join-Path $env:RUNNER_TEMP "fresh"; New-Item -ItemType Directory $d | Out-Null
          Copy-Item install.ps1 $d
          Set-Location $d
          powershell -ExecutionPolicy Bypass -File install.ps1 -NoBrowser -NoStart -Repo "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}"
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Launcher starts the server
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "fresh\conflux"
          if (-not (Test-Path "$root\start-conflux.cmd")) { throw "launcher missing" }
          $p = Start-Process -FilePath node -ArgumentList "apps\server\src\main.ts" -WorkingDirectory $root -PassThru
          $ok = $false
          for ($i = 0; $i -lt 30; $i++) { try { $r = Invoke-RestMethod http://127.0.0.1:8787/api/health; if ($r.ok) { $ok = $true; break } } catch {}; Start-Sleep 1 }
          Stop-Process $p -Force
          if (-not $ok) { throw "server did not start" }
          Write-Host "health ok"

  install-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Run installer the way a user would
        run: ./install.sh --yes --no-start
      - name: Installed copy starts and reports browser + desktop
        run: |
          test -x start-conflux.sh
          test -f ~/.local/share/applications/conflux.desktop
          node apps/server/src/main.ts & echo $! > pid
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8787/api/health > h.json && break; sleep 1; done
          cat h.json
          node -e 'const h=require("./h.json"); if(!h.capabilities.browser) throw "no browser"; if(!h.capabilities.desktop) throw "no desktop"'
          curl -sf http://127.0.0.1:8787/ | grep -q 'id="root"'
          kill $(cat pid)
