name: ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npx tsc -p .
      - run: npm test
      - run: npm run build:web
      - name: Server starts
        shell: bash
        run: |
          PORT=8799 CONFLUX_DATA_DIR=./ci-data node apps/server/src/main.ts & echo $! > pid
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8799/api/health && break; sleep 1; done
          curl -sf http://127.0.0.1:8799/api/health
          curl -sf http://127.0.0.1:8799/ | grep -q "<div id=\"root\">"
          kill $(cat pid) || true

  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: node --test --test-concurrency=1 tests/live.test.ts
        env:
          CONFLUX_LIVE: "1"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
